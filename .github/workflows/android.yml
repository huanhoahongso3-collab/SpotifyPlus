name: Build Spotify Plus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/spotifyplus-release.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spotifyplus-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag -y || true
          gh release create dev app/build/outputs/apk/release/app-release.apk --prerelease --target "$GITHUB_SHA" --title "Dev build" --notes "Automated build of ${GITHUB_SHA}"
